name: Build and publish AyuGram Flatpak

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: AyuGram release tag (leave empty for the latest stable release)
        required: false
        type: string

concurrency:
  group: ayugram-flatpak-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.compare.outputs.needed }}
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
      app_version: ${{ steps.release.outputs.app_version }}
      release_date: ${{ steps.release.outputs.release_date }}
      upstream_release_url: ${{ steps.release.outputs.upstream_release_url }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/upstream_release.py
          --tag "${{ inputs.upstream_tag }}"
          --github-output "$GITHUB_OUTPUT"
      - id: compare
        env:
          APP_VERSION: ${{ steps.release.outputs.app_version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          current_version=$(curl -fsSL --retry 2 \
            "https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/version" || true)
          if [[ $GITHUB_EVENT_NAME == schedule && $current_version == "$APP_VERSION" ]]; then
            echo "AyuGram $APP_VERSION is already published"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    if: needs.resolve.outputs.needed == 'true'
    needs: resolve
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y flatpak flatpak-builder pipx
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y flatpak flatpak-builder pipx
          else
            echo "Install Docker, Flatpak, flatpak-builder, Git, Python and pipx on this runner" >&2
            exit 1
          fi
          pipx install poetry
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          docker info
      - name: Prepare release metadata
        run: >-
          python3 scripts/prepare_release.py
          --repository "$GITHUB_REPOSITORY"
          --version "${{ needs.resolve.outputs.app_version }}"
          --date "${{ needs.resolve.outputs.release_date }}"
          --release-url "${{ needs.resolve.outputs.upstream_release_url }}"
      - name: Build AyuGram and its Flatpak repository
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: ./scripts/build.sh "${{ needs.resolve.outputs.upstream_tag }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
