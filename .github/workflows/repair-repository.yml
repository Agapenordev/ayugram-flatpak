name: Repair published Flatpak repository

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful release run whose Pages artifact should be reused
        required: true
        type: string
      branch:
        description: Flatpak branch to repair
        required: true
        default: stable
        type: string

permissions:
  actions: read
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .repair
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Repair the app ref without rebuilding AyuGram
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          mkdir _site
          tar -xf .repair/artifact.tar -C _site
          ref_dir=_site/repo/refs/heads/app/com.ayugram.desktop/x86_64
          test -f "$ref_dir/master"
          cp "$ref_dir/master" "$ref_dir/$BRANCH"
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak build-update-repo _site/repo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
